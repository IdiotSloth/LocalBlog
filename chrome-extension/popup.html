<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>剪藏到 Local Blog KB</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: -apple-system, system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 16px; }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    button {
      width: 100%; padding: 10px 16px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .status { margin-top: 10px; font-size: 12px; color: #8b949e; text-align: center; }
    .error { color: #f85149; }
    .success { color: #3fb950; }
    .last-clip { margin-top: 14px; padding-top: 12px; border-top: 1px solid #30363d; }
    .last-clip h3 { font-size: 12px; font-weight: 600; color: #8b949e; margin-bottom: 6px; }
    .last-clip .title { font-size: 13px; color: #3b82f6; margin-bottom: 4px; }
    .last-clip .excerpt { font-size: 11px; color: #8b949e; line-height: 1.4; max-height: 4em; overflow: hidden; }
    .note { font-size: 11px; color: #6e7681; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <h2>剪藏到 Local Blog KB</h2>
  <button id="clipBtn" class="btn-primary">剪藏当前页面</button>
  <div id="status" class="status"></div>
  <div id="lastClip" class="last-clip" hidden></div>
  <p class="note">或在任意页面右键 → "剪藏到 Local Blog KB"</p>
  <script src="popup.js"></script>
</body>
</html>
