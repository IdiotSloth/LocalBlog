<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
  <rect width="720" height="320" fill="#0d1117"/>

  <text x="360" y="30" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="20" font-weight="700" fill="#c9d1d9">搜索系统</text>
  <text x="360" y="50" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="12" fill="#8b949e">CJK 三层索引 + 语义搜索 + 引用统一</text>

  <!-- 2x2 Feature Grid -->
  <g transform="translate(20, 70)">
    <!-- CJK -->
    <rect x="0" y="0" width="330" height="90" fill="#161b22"/>
    <rect x="0" y="0" width="3" height="90" fill="#58a6ff"/>
    <text x="16" y="22" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">CJK 三层索引</text>
    <text x="16" y="42" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#c9d1d9">Unigram (单字) + Bigram (二字) + Word (分词)</text>
    <text x="16" y="60" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#8b949e">搜索「部」→ 找到「部署」· 搜索「全」→ 找到「全文搜索」</text>
    <text x="16" y="78" font-family="Inter,Noto Sans SC,sans-serif" font-size="10" fill="#484f58">权重: word=1.0 · bigram=0.5 · unigram=0.25</text>

    <!-- Semantic -->
    <rect x="350" y="0" width="350" height="90" fill="#161b22"/>
    <rect x="350" y="0" width="3" height="90" fill="#3fb950"/>
    <text x="366" y="22" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" font-weight="700" fill="#3fb950">语义搜索</text>
    <text x="366" y="42" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#c9d1d9">multilingual-e5-small · 384维向量 · ONNX 本地推理</text>
    <text x="366" y="60" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#8b949e">混合打分 = 0.6 × 向量相似度 + 0.4 × 关键词得分</text>
    <text x="366" y="78" font-family="Inter,Noto Sans SC,sans-serif" font-size="10" fill="#484f58">首次空闲后台下载 120MB 模型 · 不可用→纯关键词降级</text>

    <!-- Ctrl+K -->
    <rect x="0" y="108" width="330" height="75" fill="#161b22"/>
    <text x="16" y="130" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" font-weight="700" fill="#c9d1d9">Ctrl+K 命令面板</text>
    <text x="16" y="150" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#8b949e">全局搜索 + 命令列表 + 最近浏览 + 结果高亮</text>
    <text x="16" y="170" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#8b949e">操作符: tag:标签名 · type:blog|knowledge</text>

    <!-- Ref search -->
    <rect x="350" y="108" width="350" height="75" fill="#161b22"/>
    <text x="366" y="130" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" font-weight="700" fill="#c9d1d9">引用搜索统一 (D88)</text>
    <text x="366" y="150" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#8b949e">[[ 自动补全接入 FTS5 Worker · CJK 分词 + TF-IDF 排序</text>
    <text x="366" y="170" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#8b949e">替代旧 SQL LIKE · 一次重构统一两个搜索入口</text>
  </g>

  <text x="360" y="300" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#3fb950">搜索「部」可找到「部署」· 单字搜索零遗漏 · 语义理解「哺乳动物」→「鲸鱼」</text>
</svg>
