<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <rect width="720" height="360" fill="#0d1117"/>

  <!-- Title -->
  <text x="360" y="55" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="32" font-weight="700" fill="#c9d1d9">Local Blog KB</text>
  <line x1="300" y1="65" x2="420" y2="65" stroke="#58a6ff" stroke-width="2"/>

  <!-- Subtitle -->
  <text x="360" y="88" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="15" fill="#8b949e">离线优先的个人知识中枢</text>

  <!-- Stat Cards Row -->
  <g transform="translate(40, 120)">
    <!-- Card 1: Green -->
    <rect x="0" y="0" width="200" height="70" rx="0" fill="#161b22"/>
    <rect x="0" y="0" width="3" height="70" fill="#3fb950"/>
    <text x="103" y="30" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#c9d1d9">离线可用</text>
    <text x="103" y="50" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#8b949e">零云端依赖</text>

    <!-- Card 2: Blue -->
    <rect x="220" y="0" width="230" height="70" rx="0" fill="#161b22"/>
    <rect x="220" y="0" width="3" height="70" fill="#58a6ff"/>
    <text x="335" y="30" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#c9d1d9">MySQL + SQLite 双引擎</text>
    <text x="335" y="50" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#8b949e">本地 &amp; 网络双模式</text>

    <!-- Card 3: Gray -->
    <rect x="470" y="0" width="210" height="70" rx="0" fill="#161b22"/>
    <rect x="470" y="0" width="3" height="70" fill="#8b949e"/>
    <text x="575" y="30" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="17" font-weight="600" fill="#c9d1d9">全格式支持</text>
    <text x="575" y="50" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="11" fill="#8b949e">DOCX/XLSX/PDF/MD</text>
  </g>

  <!-- Tagline -->
  <text x="360" y="240" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="14" fill="#8b949e">数据完全由你掌控 · 零云端依赖</text>

  <!-- Tech stack pills -->
  <g transform="translate(120, 275)">
    <rect x="0" y="0" width="80" height="22" rx="11" fill="#1e2433"/>
    <text x="40" y="15" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="10" fill="#58a6ff">Electron 41</text>
    <rect x="95" y="0" width="65" height="22" rx="11" fill="#1e2433"/>
    <text x="127" y="15" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="10" fill="#c9d1d9">React 19</text>
    <rect x="175" y="0" width="80" height="22" rx="11" fill="#1e2433"/>
    <text x="215" y="15" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="10" fill="#c9d1d9">TypeScript</text>
    <rect x="270" y="0" width="100" height="22" rx="11" fill="#1e2433"/>
    <text x="320" y="15" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="10" fill="#3fb950">MySQL / SQLite</text>
    <rect x="385" y="0" width="65" height="22" rx="11" fill="#1e2433"/>
    <text x="417" y="15" text-anchor="middle" font-family="Inter,Noto Sans SC,sans-serif" font-size="10" fill="#3fb950">离线可用</text>
  </g>
</svg>
