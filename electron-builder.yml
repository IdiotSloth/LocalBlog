appId: com.localblogkb.app
productName: Idiot
artifactName: Idiot_SetUp.exe
directories:
  output: dist2
  buildResources: build
files:
  - out/**/*
  - img/**/*
  - node_modules/**/*
  - package.json
asarUnpack:
  - img/**
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE.txt
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: Idiot
  include: scripts/installer.nsh
win:
  target: nsis
  icon: build/icon.ico
publish:
  provider: github
  owner: IdiotSloth
  repo: LocalBlog
extraResources:
  - from: img/
    to: img/
electronDist: node_modules/electron/dist
npmRebuild: false
