appId: com.localblogkb.app
productName: Idiot
artifactName: Idiot_SetUp.exe
directories:
  output: dist
  buildResources: img
files:
  - out/**/*
  - scripts/launcher.bat
  - node_modules/**/*
  - package.json
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE.txt
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Idiot
win:
  target: nsis
  icon: build/icon.png
publish:
  provider: github
  owner: IdiotSloth
  repo: web
extraResources:
  - from: scripts/launcher.bat
    to: launcher.bat
electronDist: node_modules/electron/dist
npmRebuild: false
