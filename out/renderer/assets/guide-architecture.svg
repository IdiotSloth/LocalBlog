<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d55" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#889bb0"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a2840"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="32" fill="#e2e8f0" font-size="16" font-weight="700">Local Blog KB — 系统架构图</text>
  <text x="30" y="50" fill="#889bb0" font-size="10">Electron 41 + React 19 + TypeScript + MySQL/sql.js 双后端</text>

  <!-- ═══ Layer 1: Desktop Shell ═══ -->
  <rect x="20" y="70" width="960" height="290" rx="10" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="8,4" stroke-opacity="0.4"/>
  <text x="36" y="90" fill="#60a5fa" font-size="10" font-weight="600">Electron 41 Desktop Shell</text>

  <!-- Renderer -->
  <rect x="40" y="105" width="300" height="240" rx="6" fill="#1a2840"/>
  <rect x="40" y="105" width="300" height="240" rx="6" fill="rgba(8,51,68,0.50)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="190" y="128" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">Renderer (React 19 + Vite 7)</text>
  <line x1="60" y1="138" x2="320" y2="138" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="0.5"/>

  <text x="60" y="158" fill="#94a3b8" font-size="9">📝 Blog Editor (Tiptap)</text>
  <text x="60" y="178" fill="#94a3b8" font-size="9">📚 Knowledge Base</text>
  <text x="60" y="198" fill="#94a3b8" font-size="9">📊 Dashboard (Calendar / Stats)</text>
  <text x="60" y="218" fill="#94a3b8" font-size="9">🔍 Global Search (FTS5 Worker)</text>
  <text x="60" y="238" fill="#94a3b8" font-size="9">🏷️ Tags · ♻️ Recycle · 🎨 Settings</text>
  <text x="60" y="258" fill="#94a3b8" font-size="9">📑 Guide · 📅 Calendar · 📝 Memo</text>
  <text x="60" y="285" fill="#889bb0" font-size="8">CSS var(--token) · createHashRouter · React.lazy</text>
  <text x="60" y="303" fill="#889bb0" font-size="8">DOMPurify · useReducer · Zustand 5</text>
  <text x="60" y="321" fill="#889bb0" font-size="8">Tailwind CSS v4 · Inter / JetBrains Mono</text>

  <!-- Preload -->
  <rect x="370" y="180" width="170" height="90" rx="6" fill="#1a2840"/>
  <rect x="370" y="180" width="170" height="90" rx="6" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="1.2"/>
  <text x="455" y="205" fill="#fb923c" font-size="10" font-weight="600" text-anchor="middle">Preload</text>
  <text x="455" y="223" fill="#94a3b8" font-size="8" text-anchor="middle">contextBridge</text>
  <text x="455" y="241" fill="#94a3b8" font-size="8" text-anchor="middle">WindowApi (99 ch)</text>
  <text x="455" y="259" fill="#889bb0" font-size="7" text-anchor="middle">IPC.EVT_* constants</text>

  <!-- Main Process -->
  <rect x="570" y="105" width="390" height="240" rx="6" fill="#1a2840"/>
  <rect x="570" y="105" width="390" height="240" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.2"/>
  <text x="765" y="128" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Main Process (Node.js)</text>
  <line x1="590" y1="138" x2="940" y2="138" stroke="#34d399" stroke-opacity="0.2" stroke-width="0.5"/>

  <text x="590" y="158" fill="#94a3b8" font-size="9">IPC Handlers (16 files · 99 channels)</text>
  <text x="590" y="178" fill="#94a3b8" font-size="9">Services (blog/knowledge/note/tag/folder/search)</text>
  <text x="590" y="198" fill="#94a3b8" font-size="9">🖱️ System Tray · 🐱 Desktop Pet</text>
  <text x="590" y="218" fill="#94a3b8" font-size="9">⌨️ Global Shortcuts · 🔄 Auto Updater</text>
  <text x="590" y="238" fill="#94a3b8" font-size="9">💾 Backup Service · 📋 Note Cleaner</text>
  <text x="590" y="258" fill="#94a3b8" font-size="9">🖨️ PDF Export · 📤 Blog Export</text>
  <text x="590" y="285" fill="#889bb0" font-size="8">uncaughtException → IPC.EVT_APP_ERROR</text>
  <text x="590" y="303" fill="#889bb0" font-size="8">process.resourcesPath · app.getPath('userData')</text>
  <text x="590" y="321" fill="#889bb0" font-size="8">requestSingleInstanceLock · sandbox:true</text>

  <!-- Arrows between layers -->
  <path d="M 340 230 L 366 230" fill="none" stroke="#889bb0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 540 230 L 566 230" fill="none" stroke="#889bb0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Renderer ↔ Main bidirectional label -->
  <text x="390" y="172" fill="#889bb0" font-size="7" text-anchor="middle">invoke(IPC.DOMAIN:ACTION)</text>
  <text x="510" y="275" fill="#889bb0" font-size="7" text-anchor="middle">EVT_* events</text>

  <!-- ═══ IPC Bus ═══ -->
  <rect x="40" y="310" width="920" height="22" rx="4" fill="#1a2840"/>
  <rect x="40" y="310" width="920" height="22" rx="4" fill="rgba(251,146,60,0.38)" stroke="#fb923c" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="500" y="325" fill="#fb923c" font-size="8" text-anchor="middle">IPC Message Bus · { success: boolean, data?: T, error?: string } · 7-file checklist per channel · shared/handlers/ SQL builders</text>

  <!-- Arrow from Main to DB -->
  <path d="M 500 360 L 500 420" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="6,3"/>

  <!-- ═══ Layer 2: Express Web Server ═══ -->
  <rect x="20" y="380" width="960" height="110" rx="10" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="8,4" stroke-opacity="0.4"/>
  <text x="36" y="400" fill="#fbbf24" font-size="10" font-weight="600">Express 5 Web Server (Port 3456)</text>

  <rect x="40" y="415" width="440" height="60" rx="6" fill="#1a2840"/>
  <rect x="40" y="415" width="440" height="60" rx="6" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="260" y="438" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">REST API Routes</text>
  <text x="260" y="455" fill="#94a3b8" font-size="8" text-anchor="middle">/api/auth · /api/blogs · /api/knowledge · /api/tags · /api/recycle</text>
  <text x="260" y="468" fill="#889bb0" font-size="7" text-anchor="middle">requireAuth middleware · user_id isolation · multer uploads</text>

  <rect x="510" y="415" width="230" height="60" rx="6" fill="#1a2840"/>
  <rect x="510" y="415" width="230" height="60" rx="6" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="625" y="438" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">JWT Cookie Auth</text>
  <text x="625" y="455" fill="#94a3b8" font-size="8" text-anchor="middle">PBKDF2 Password Hashing</text>
  <text x="625" y="468" fill="#889bb0" font-size="7" text-anchor="middle">httpOnly · sameSite: lax</text>

  <rect x="770" y="415" width="190" height="60" rx="6" fill="#1a2840"/>
  <rect x="770" y="415" width="190" height="60" rx="6" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="865" y="438" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">Static SPA Hosting</text>
  <text x="865" y="455" fill="#94a3b8" font-size="8" text-anchor="middle">React SPA · Hash Router</text>
  <text x="865" y="468" fill="#889bb0" font-size="7" text-anchor="middle">Web mode api-client stubs</text>

  <!-- Arrow from Main Process to Express -->
  <path d="M 500 345 L 500 380" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ═══ Layer 3: Database ═══ -->
  <rect x="20" y="510" width="960" height="155" rx="10" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4" stroke-opacity="0.4"/>
  <text x="36" y="530" fill="#a78bfa" font-size="10" font-weight="600">Database Layer — Dual Backend</text>

  <!-- sql.js -->
  <g transform="translate(80, 545)">
    <rect x="0" y="12" width="260" height="78" rx="4" fill="#1a2840"/>
    <ellipse cx="130" cy="12" rx="130" ry="14" fill="#1a2840"/>
    <ellipse cx="130" cy="90" rx="130" ry="14" fill="#1a2840"/>
    <rect x="0" y="12" width="260" height="78" fill="rgba(76,29,149,0.50)"/>
    <ellipse cx="130" cy="12" rx="130" ry="14" fill="rgba(76,29,149,0.50)" stroke="#a78bfa" stroke-width="1.2"/>
    <ellipse cx="130" cy="90" rx="130" ry="14" fill="rgba(76,29,149,0.50)" stroke="#a78bfa" stroke-width="1.2"/>
    <line x1="0" y1="12" x2="0" y2="90" stroke="#a78bfa" stroke-width="1.2"/>
    <line x1="260" y1="12" x2="260" y2="90" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="130" y="42" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">sql.js (SQLite WASM)</text>
    <text x="130" y="58" fill="#94a3b8" font-size="8" text-anchor="middle">Offline / Local-first · saveToDisk()</text>
    <text x="130" y="72" fill="#889bb0" font-size="7" text-anchor="middle">10 tables · ALTER TABLE migrations</text>
  </g>

  <!-- MySQL -->
  <g transform="translate(620, 545)">
    <rect x="0" y="12" width="280" height="78" rx="4" fill="#1a2840"/>
    <ellipse cx="140" cy="12" rx="140" ry="14" fill="#1a2840"/>
    <ellipse cx="140" cy="90" rx="140" ry="14" fill="#1a2840"/>
    <rect x="0" y="12" width="280" height="78" fill="rgba(76,29,149,0.50)"/>
    <ellipse cx="140" cy="12" rx="140" ry="14" fill="rgba(76,29,149,0.50)" stroke="#a78bfa" stroke-width="1.2"/>
    <ellipse cx="140" cy="90" rx="140" ry="14" fill="rgba(76,29,149,0.50)" stroke="#a78bfa" stroke-width="1.2"/>
    <line x1="0" y1="12" x2="0" y2="90" stroke="#a78bfa" stroke-width="1.2"/>
    <line x1="280" y1="12" x2="280" y2="90" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="140" y="42" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">MySQL 8.3</text>
    <text x="140" y="58" fill="#94a3b8" font-size="8" text-anchor="middle">Server / Networked · FULLTEXT INDEX</text>
    <text x="140" y="72" fill="#889bb0" font-size="7" text-anchor="middle">MYSQL_MIGRATIONS · MATCH ... AGAINST</text>
  </g>

  <!-- Unified async wrapper -->
  <rect x="360" y="550" width="220" height="30" rx="4" fill="#1a2840"/>
  <rect x="360" y="550" width="220" height="30" rx="4" fill="rgba(59,130,246,0.38)" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="470" y="569" fill="#60a5fa" font-size="8" font-weight="500" text-anchor="middle">dbGet&lt;T&gt; / dbAll&lt;T&gt; / dbRun</text>

  <!-- ═══ Layer 4: FTS5 Search Worker ═══ -->
  <rect x="20" y="685" width="960" height="105" rx="10" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="8,4" stroke-opacity="0.4"/>
  <text x="36" y="705" fill="#34d399" font-size="10" font-weight="600">FTS5 Full-Text Search (sql.js Mode)</text>

  <rect x="40" y="720" width="440" height="55" rx="6" fill="#1a2840"/>
  <rect x="40" y="720" width="440" height="55" rx="6" fill="rgba(6,78,59,0.38)" stroke="#34d399" stroke-width="1.2"/>
  <text x="260" y="740" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">Web Worker — Inverted Index</text>
  <text x="260" y="757" fill="#94a3b8" font-size="8" text-anchor="middle">Intl.Segmenter (CJK Tokenizer) · TF-IDF Scoring · Title Match Boost</text>
  <text x="260" y="770" fill="#889bb0" font-size="7" text-anchor="middle">localStorage cache · Map&lt;correlationId, resolve&gt; · Worker onerror</text>

  <rect x="510" y="720" width="230" height="55" rx="6" fill="#1a2840"/>
  <rect x="510" y="720" width="230" height="55" rx="6" fill="rgba(6,78,59,0.2)" stroke="#34d399" stroke-width="1"/>
  <text x="625" y="740" fill="#94a3b8" font-size="9" font-weight="500" text-anchor="middle">search.worker.ts</text>
  <text x="625" y="757" fill="#889bb0" font-size="7" text-anchor="middle">build-index · search · add/remove-doc</text>
  <text x="625" y="770" fill="#889bb0" font-size="7" text-anchor="middle">EVT_BLOG_REFRESH → re-index</text>

  <rect x="770" y="720" width="190" height="55" rx="6" fill="#1a2840"/>
  <rect x="770" y="720" width="190" height="55" rx="6" fill="rgba(6,78,59,0.2)" stroke="#34d399" stroke-width="1"/>
  <text x="865" y="740" fill="#94a3b8" font-size="9" font-weight="500" text-anchor="middle">use-search.ts</text>
  <text x="865" y="757" fill="#889bb0" font-size="7" text-anchor="middle">Dual mode: MySQL/Worker</text>
  <text x="865" y="770" fill="#889bb0" font-size="7" text-anchor="middle">{search,loading,ready}</text>

  <!-- Legend -->
  <g transform="translate(40, 800)">
    <text x="0" y="0" fill="#889bb0" font-size="8">Legend:</text>
    <line x1="60" y1="-4" x2="100" y2="-4" stroke="#22d3ee" stroke-width="2"/>
    <text x="105" y="0" fill="#94a3b8" font-size="7">Renderer</text>
    <line x1="165" y1="-4" x2="205" y2="-4" stroke="#34d399" stroke-width="2"/>
    <text x="210" y="0" fill="#94a3b8" font-size="7">Main Process</text>
    <line x1="285" y1="-4" x2="325" y2="-4" stroke="#fbbf24" stroke-width="2"/>
    <text x="330" y="0" fill="#94a3b8" font-size="7">Express Server</text>
    <line x1="410" y1="-4" x2="450" y2="-4" stroke="#a78bfa" stroke-width="2"/>
    <text x="455" y="0" fill="#94a3b8" font-size="7">Database</text>
    <line x1="520" y1="-4" x2="560" y2="-4" stroke="#fb923c" stroke-width="2"/>
    <text x="565" y="0" fill="#94a3b8" font-size="7">IPC Bus</text>
    <text x="640" y="0" fill="#889bb0" font-size="7">IPC: 99 channels · Tests: 49/49 · P0+P1+P2: 0</text>
  </g>
</svg>
