<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <linearGradient id="hero-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
  </style>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="35" y="32" fill="#e2e8f0" font-size="16" font-weight="700">博客写作工作流</text>
  <text x="35" y="50" fill="#64748b" font-size="10">从灵感到发布 — 完整创作链路</text>

  <!-- === Flow 1: Write === -->
  <g>
    <rect x="30" y="80" width="180" height="55" rx="8" fill="#0f172a"/>
    <rect x="30" y="80" width="180" height="55" rx="8" fill="url(#hero-grad)" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="120" y="102" fill="#22d3ee" font-size="12" font-weight="600" text-anchor="middle">✍️ 开始写作</text>
    <text x="120" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">新建博客 / 选择模板</text>
  </g>
  <path d="M 210 107 L 260 107" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="270" y="80" width="200" height="55" rx="8" fill="#0f172a"/>
    <rect x="270" y="80" width="200" height="55" rx="8" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="370" y="100" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">📝 Markdown 编辑</text>
    <text x="370" y="118" fill="#94a3b8" font-size="8" text-anchor="middle">Tiptap WYSIWYG / 源码切换</text>
    <text x="370" y="132" fill="#64748b" font-size="7" text-anchor="middle">Ctrl+B/I 格式 · 模板系统 · 专注模式</text>
  </g>
  <path d="M 470 107 L 520 107" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="530" y="80" width="180" height="55" rx="8" fill="#0f172a"/>
    <rect x="530" y="80" width="180" height="55" rx="8" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="1.2"/>
    <text x="620" y="100" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">💾 自动草稿</text>
    <text x="620" y="118" fill="#94a3b8" font-size="8" text-anchor="middle">30s 自动保存 + 恢复提示</text>
    <text x="620" y="132" fill="#64748b" font-size="7" text-anchor="middle">blog_drafts · Ctrl+S 手动保存</text>
  </g>

  <!-- === Flow 2: Organize === -->
  <path d="M 620 135 L 620 170" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <g>
    <rect x="530" y="175" width="180" height="55" rx="8" fill="#0f172a"/>
    <rect x="530" y="175" width="180" height="55" rx="8" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="620" y="197" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">🏷️ 整理与关联</text>
    <text x="620" y="215" fill="#94a3b8" font-size="8" text-anchor="middle">标签 · 系列 · 文件夹</text>
    <text x="620" y="229" fill="#64748b" font-size="7" text-anchor="middle">标签关联面板 · 系列上一篇/下一篇</text>
  </g>

  <path d="M 530 202 L 480 202" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="270" y="175" width="200" height="55" rx="8" fill="#0f172a"/>
    <rect x="270" y="175" width="200" height="55" rx="8" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="370" y="197" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">🔍 预览与搜索</text>
    <text x="370" y="215" fill="#94a3b8" font-size="8" text-anchor="middle">阅读模式 · TOC · 进度记忆</text>
    <text x="370" y="229" fill="#64748b" font-size="7" text-anchor="middle">FTS5 全文搜索 · 博客引用链接</text>
  </g>

  <!-- === Flow 3: Publish === -->
  <path d="M 370 230 L 370 265" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <g>
    <rect x="270" y="270" width="200" height="55" rx="8" fill="#0f172a"/>
    <rect x="270" y="270" width="200" height="55" rx="8" fill="rgba(76,29,149,0.25)" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="370" y="292" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">📤 发布与导出</text>
    <text x="370" y="310" fill="#94a3b8" font-size="8" text-anchor="middle">导出 PDF · Word · Markdown</text>
    <text x="370" y="324" fill="#64748b" font-size="7" text-anchor="middle">打印级排版 · 批量导出</text>
  </g>

  <!-- === Sidebar: Tools === -->
  <rect x="730" y="80" width="150" height="245" rx="8" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" stroke-opacity="0.4"/>
  <text x="805" y="102" fill="#64748b" font-size="9" font-weight="500" text-anchor="middle">辅助功能</text>
  <text x="750" y="128" fill="#94a3b8" font-size="8">📑 缩小化标签条</text>
  <text x="750" y="150" fill="#94a3b8" font-size="8">📊 字数/阅读时间</text>
  <text x="750" y="172" fill="#94a3b8" font-size="8">🕮 历史版本回滚</text>
  <text x="750" y="194" fill="#94a3b8" font-size="8">🖼️ 附件管理</text>
  <text x="750" y="216" fill="#94a3b8" font-size="8">🔗 超链接安全跳转</text>
  <text x="750" y="238" fill="#94a3b8" font-size="8">🔄 博客引用参考</text>
  <text x="750" y="260" fill="#94a3b8" font-size="8">📱 记录浏览历史</text>

  <!-- === Bottom: Stats Bar === -->
  <rect x="30" y="360" width="850" height="50" rx="6" fill="#0f172a"/>
  <rect x="30" y="360" width="850" height="50" rx="6" fill="rgba(59,130,246,0.1)" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="70" y="380" fill="#60a5fa" font-size="9" font-weight="500">编辑器特性</text>
  <text x="70" y="396" fill="#94a3b8" font-size="8">所见即所得</text>
  <text x="190" y="396" fill="#94a3b8" font-size="8">Markdown 源码</text>
  <text x="320" y="396" fill="#94a3b8" font-size="8">5 套阅读主题</text>
  <text x="440" y="396" fill="#94a3b8" font-size="8">自动目录 TOC</text>
  <text x="560" y="396" fill="#94a3b8" font-size="8">快捷键可定制</text>
  <text x="680" y="396" fill="#94a3b8" font-size="8">暗色/亮色主题</text>
  <text x="800" y="396" fill="#94a3b8" font-size="8">200ms 过渡</text>

  <!-- Stats -->
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="130" height="36" rx="4" fill="#0f172a"/>
    <rect x="0" y="0" width="130" height="36" rx="4" fill="rgba(34,211,238,0.1)" stroke="#22d3ee" stroke-width="0.8"/>
    <text x="65" y="16" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="middle">Ctrl+S</text>
    <text x="65" y="30" fill="#64748b" font-size="7" text-anchor="middle">保存到 DB + 文件</text>
  </g>
  <g transform="translate(210, 440)">
    <rect x="0" y="0" width="150" height="36" rx="4" fill="#0f172a"/>
    <rect x="0" y="0" width="150" height="36" rx="4" fill="rgba(52,211,153,0.1)" stroke="#34d399" stroke-width="0.8"/>
    <text x="75" y="16" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">30s Auto-Save</text>
    <text x="75" y="30" fill="#64748b" font-size="7" text-anchor="middle">blog_drafts 草稿表</text>
  </g>
  <g transform="translate(380, 440)">
    <rect x="0" y="0" width="160" height="36" rx="4" fill="#0f172a"/>
    <rect x="0" y="0" width="160" height="36" rx="4" fill="rgba(251,191,36,0.1)" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="80" y="16" fill="#fbbf24" font-size="9" font-weight="600" text-anchor="middle">字数 + 阅读时间</text>
    <text x="80" y="30" fill="#64748b" font-size="7" text-anchor="middle">实时统计 · CJK 感知</text>
  </g>
  <g transform="translate(560, 440)">
    <rect x="0" y="0" width="170" height="36" rx="4" fill="#0f172a"/>
    <rect x="0" y="0" width="170" height="36" rx="4" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="0.8"/>
    <text x="85" y="16" fill="#a78bfa" font-size="9" font-weight="600" text-anchor="middle">React.lazy + Suspense</text>
    <text x="85" y="30" fill="#64748b" font-size="7" text-anchor="middle">页面按需加载</text>
  </g>
</svg>
