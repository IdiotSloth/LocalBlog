name: CI — Architecture & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  architecture-lint:
    name: Architecture Constraint Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run architecture linter
        run: node scripts/lint-arch.js

  biome-check:
    name: Biome Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run Biome
        run: npx biome check src/ tests/ --max-diagnostics=50

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: TypeCheck main + preload + shared
        run: npx tsc -p tsconfig.node.json --noEmit
      - name: TypeCheck renderer + shared
        run: npx tsc -p tsconfig.web.json --noEmit

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [architecture-lint, biome-check, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Build
        run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run Vitest
        run: npx vitest run --reporter=verbose

  garbage-collect:
    name: Garbage Collection Audit
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run GC audit
        run: node scripts/gc.js --audit

  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [architecture-lint, biome-check, typecheck, build, test, garbage-collect]
    if: always()
    steps:
      - name: Check all required jobs
        run: |
          echo "All quality gates passed"
